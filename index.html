<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pondok Pesantren Hidayatul Mubtadi'in - SIMPONI Portal</title>
    <meta name="description"
        content="Sistem Informasi & Manajemen Pesantren (SIMPONI) Pondok Pesantren Salaf & Modern Hidayatul Mubtadi'in Nganjuk terintegrasi Google Cloud.">
    <meta name="theme-color" content="#041c14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIMPONI Pesantren">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Pondok Pesantren Hidayatul Mubtadi'in - SIMPONI Portal">
    <meta property="og:description"
        content="Layanan Administrasi Santri, PPDB Online, Tabungan Santri, Absensi, Perizinan, dan Akademik Terpadu.">
    <meta property="og:type" content="website">

    <!-- Favicon SVG (Islamic Emerald & Gold Crescent Seal) -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23064e3b'/><circle cx='50' cy='50' r='42' fill='none' stroke='%23d9a05d' stroke-width='2'/><path d='M50 20 L58 36 L76 38 L62 50 L66 68 L50 58 L34 68 L38 50 L24 38 L42 36 Z' fill='%23d9a05d'/><circle cx='50' cy='46' r='7' fill='%23064e3b'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #041c14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Fullscreen Viewport Iframe */
        #simponi-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background-color: #041c14;
        }

        /* Ambient Splash Loading Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 9999;
            background-color: #041c14;
            background-image:
                radial-gradient(circle at 20% 25%, rgba(16, 185, 129, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 75%, rgba(217, 160, 93, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 78, 59, 0.35) 0%, transparent 65%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 440px;
            width: 100%;
        }

        /* Glowing Islamic Emblem */
        .emblem-wrapper {
            position: relative;
            width: 86px;
            height: 86px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emblem-glow {
            position: absolute;
            inset: -8px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(217, 160, 93, 0.4));
            border-radius: 50%;
            filter: blur(14px);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        .emblem-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            border: 2px solid rgba(217, 160, 93, 0.55);
            box-shadow: 0 12px 30px -5px rgba(4, 120, 87, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emblem-icon {
            width: 50px;
            height: 50px;
            fill: #d9a05d;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.92);
                opacity: 0.35;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.75;
            }
        }

        /* Typography */
        .splash-institution {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #d9a05d;
            margin-bottom: 0.35rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .splash-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
            margin-bottom: 0.4rem;
        }

        .splash-subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            margin-bottom: 2rem;
            line-height: 1.45;
        }

        /* Progress Bar */
        .progress-track {
            width: 220px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1rem;
        }

        .progress-bar-animated {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 45%;
            background: linear-gradient(90deg, #10b981 0%, #34d399 50%, #d9a05d 100%);
            border-radius: 999px;
            animation: progressSlide 1.8s ease-in-out infinite;
        }

        @keyframes progressSlide {
            0% {
                left: -45%;
                width: 35%;
            }

            50% {
                left: 30%;
                width: 55%;
            }

            100% {
                left: 100%;
                width: 35%;
            }
        }

        .splash-status-text {
            font-size: 0.78rem;
            color: #6ee7b7;
            font-weight: 500;
            letter-spacing: 0.02em;
            min-height: 18px;
        }

        /* Fallback Retry Area */
        .splash-timeout-action {
            margin-top: 1.5rem;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .splash-timeout-action.show {
            display: block;
            opacity: 1;
        }

        .btn-reload {
            background: rgba(6, 78, 59, 0.8);
            border: 1px solid rgba(217, 160, 93, 0.4);
            color: #fef3c7;
            padding: 0.55rem 1.25rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-reload:hover {
            background: rgba(6, 78, 59, 1);
            border-color: #d9a05d;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <!-- Splash Screen Ambient -->
    <div id="splash-screen">
        <div class="splash-card">
            <div class="emblem-wrapper">
                <div class="emblem-glow"></div>
                <div class="emblem-box">
                    <!-- Mosque / Star Seal Icon -->
                    <svg class="emblem-icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2L14.2 6.6L19 7.4L15.5 10.9L16.3 15.8L12 13.5L7.7 15.8L8.5 10.9L5 7.4L9.8 6.6L12 2Z" />
                        <path
                            d="M12 14C8.7 14 6 16.7 6 20H18C18 16.7 15.3 14 12 14ZM12 16C13.4 16 14.6 17.2 15.1 18.7C14.2 18.3 13.1 18 12 18C10.9 18 9.8 18.3 8.9 18.7C9.4 17.2 10.6 16 12 16Z"
                            opacity="0.8" />
                    </svg>
                </div>
            </div>

            <div class="splash-institution">Pondok Pesantren Hidayatul Mubtadi'in</div>
            <h1 class="splash-title">SIMPONI Portal</h1>
            <p class="splash-subtitle">Sistem Informasi & Manajemen Terpadu Pesantren</p>

            <div class="progress-track">
                <div class="progress-bar-animated"></div>
            </div>

            <div class="splash-status-text" id="splash-status">Menghubungkan ke Cloud Server...</div>

            <div class="splash-timeout-action" id="timeout-box">
                <button type="button" class="btn-reload" onclick="reloadFrame()">
                    <span>↻</span> Muat Ulang Halaman
                </button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Google Apps Script Iframe -->
    <iframe id="simponi-frame"
        src="https://script.google.com/macros/s/AKfycbyIw1RmAJTrQLd3LaZqIDQe7L4_9NozKMSGfzNJ-VkvdCx9h3WgqTc-y-tMVddcvz-6/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-downloads"
        title="Portal Resmi SIMPONI - Pondok Pesantren Hidayatul Mubtadi'in">
    </iframe>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const frame = document.getElementById('simponi-frame');
        const statusText = document.getElementById('splash-status');
        const timeoutBox = document.getElementById('timeout-box');

        // Dynamic Loading Status Animation
        const statusMessages = [
            'Menghubungkan ke Cloud Server...',
            'Menyiapkan modul santri & database...',
            'Sinkronisasi tema & antarmuka...',
            'Membuka SIMPONI Portal...'
        ];
        let msgIndex = 0;
        const msgTimer = setInterval(() => {
            msgIndex++;
            if (msgIndex < statusMessages.length) {
                statusText.textContent = statusMessages[msgIndex];
            } else {
                clearInterval(msgTimer);
            }
        }, 1200);

        // Hide splash when iframe loaded
        frame.addEventListener('load', () => {
            clearInterval(msgTimer);
            statusText.textContent = 'Portal Siap!';
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
            }, 300);
        });

        // Timeout Fallback (Show reload button if network is slow > 8s)
        setTimeout(() => {
            if (!splashScreen.classList.contains('fade-out')) {
                timeoutBox.classList.add('show');
                statusText.textContent = 'Memuat sedikit lebih lama dari biasanya...';
            }
        }, 8000);

        function reloadFrame() {
            statusText.textContent = 'Memuat ulang...';
            frame.src = frame.src;
        }

        // Prevent double tap zooming on iOS Safari
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || now) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);
    </script>
</body>

</html>

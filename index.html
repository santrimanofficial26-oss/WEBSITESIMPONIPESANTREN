<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pondok Pesantren Hidayatul Mubtadi'in - SIMPONI Portal</title>
    <meta name="description"
        content="Sistem Informasi & Manajemen Pesantren (SIMPONI) Pondok Pesantren Salaf & Modern Hidayatul Mubtadi'in Nganjuk terintegrasi Google Cloud.">
    <meta name="theme-color" content="#041c14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIMPONI Pesantren">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Pondok Pesantren Hidayatul Mubtadi'in - SIMPONI Portal">
    <meta property="og:description"
        content="Layanan Administrasi Santri, PPDB Online, Tabungan Santri, Absensi, Perizinan, dan Akademik Terpadu.">
    <meta property="og:type" content="website">

    <!-- Favicon SVG (Islamic Emerald & Gold Crescent Seal) -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23064e3b'/><circle cx='50' cy='50' r='42' fill='none' stroke='%23d9a05d' stroke-width='2'/><path d='M50 20 L58 36 L76 38 L62 50 L66 68 L50 58 L34 68 L38 50 L24 38 L42 36 Z' fill='%23d9a05d'/><circle cx='50' cy='46' r='7' fill='%23064e3b'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #041c14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Fullscreen Viewport Iframe (Instan Langsung Muncul) */
        #simponi-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            background-color: #041c14;
        }

        #simponi-camera-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(2, 10, 18, .84);
        }

        #simponi-camera-overlay.is-open { display: flex; }

        .simponi-camera-panel {
            width: min(100%, 560px);
            max-height: 95dvh;
            overflow: auto;
            padding: 20px;
            border: 1px solid #167c69;
            border-radius: 20px;
            background: #09251f;
            color: #fff;
        }

        .simponi-camera-panel h2 { font-size: 18px; margin-bottom: 8px; }
        .simponi-camera-panel p { font-size: 13px; line-height: 1.5; margin-bottom: 14px; color: #cbd5e1; }
        #simponiCameraReader { width: 100%; overflow: hidden; border-radius: 12px; background: #000; }
        #simponiCameraStatus { min-height: 24px; margin-top: 12px; }
        #simponiCameraStop {
            margin-top: 12px;
            padding: 10px 16px;
            border: 0;
            border-radius: 10px;
            background: #0d9488;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Fullscreen Google Apps Script Iframe Langsung Tanpa Loading Screen -->
    <iframe id="simponi-frame"
        src="https://script.google.com/macros/s/AKfycbyIw1RmAJTrQLd3LaZqIDQe7L4_9NozKMSGfzNJ-VkvdCx9h3WgqTc-y-tMVddcvz-6/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-downloads"
        title="Portal Resmi SIMPONI - Pondok Pesantren Hidayatul Mubtadi'in">
    </iframe>

    <div id="simponi-camera-overlay" role="dialog" aria-modal="true" aria-labelledby="simponiCameraTitle">
        <div class="simponi-camera-panel">
            <h2 id="simponiCameraTitle">Scan QR Santri</h2>
            <p>Izinkan kamera browser, lalu arahkan QR kartu santri ke area pemindaian.</p>
            <div id="simponiCameraReader"></div>
            <p id="simponiCameraStatus" role="status" aria-live="polite">Menyiapkan kamera...</p>
            <button id="simponiCameraStop" type="button">Matikan Kamera</button>
        </div>
    </div>

    <script>
        // Prevent double tap zooming on iOS Safari
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || now) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="./camera-bridge.js"></script>
</body>

</html>

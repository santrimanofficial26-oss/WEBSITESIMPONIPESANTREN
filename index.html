    <style>
        * {

        html,

            width: 100%;

            height: 100dvh;
            overflow: hidden;

        /* Fullscreen Viewport Iframe (Instan Langsung Muncul) */
        #simponi-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

<body>

    <!-- Fullscreen Google Apps Script Iframe Langsung Tanpa Loading Screen -->
    <iframe id="simponi-frame"
        src="https://script.google.com/macros/s/AKfycbyIw1RmAJTrQLd3LaZqIDQe7L4_9NozKMSGfzNJ-VkvdCx9h3WgqTc-y-tMVddcvz-6/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"

        title="Portal Resmi SIMPONI - Pondok Pesantren Hidayatul Mubtadi'in">
    </iframe>

    <script>
        // Prevent double tap zooming on iOS Safari
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || now) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);
    </script>
